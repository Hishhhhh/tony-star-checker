name: Reset Last Post for Testing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reset latest_post_v2 and pop seen_ids
        run: |
          python -c "
          import os

          # 1. Clear latest_post_v2.txt
          with open('latest_post_v2.txt', 'w', encoding='utf-8') as f:
              f.write('')
          print('Cleared latest_post_v2.txt')

          # 2. Remove the last entry from seen_ids.txt
          if os.path.exists('seen_ids.txt'):
              with open('seen_ids.txt', 'r', encoding='utf-8') as f:
                  lines = [line.strip() for line in f if line.strip()]
              
              if lines:
                  popped = lines.pop()
                  with open('seen_ids.txt', 'w', encoding='utf-8') as f:
                      for item in lines:
                          f.write(f'{item}\n')
                  print(f'Popped last seen ID: {popped}')
              else:
                  print('seen_ids.txt was already empty.')
          "

      - name: Commit and push reset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Reset"
          git add latest_post_v2.txt seen_ids.txt
          git diff --staged --quiet || git commit -m "Reset state: cleared last seen and popped latest seen ID [skip ci]"
          git push
